[project]
name = "sign-assistant"
version = "0.1.0"
description = "Sign Language Learning Assistant backend (RSL fingerspelling)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "numpy>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",  # type stubs only, so mypy can check ml/
]
# Dataset extraction, training and the webcam scripts. Not installed by
# default, so the API image stays slim: use `uv sync --group ml`.
ml = [
    "mediapipe>=0.10",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
# ml/ scripts import each other as top-level modules (python ml/train.py puts
# ml/ on sys.path); experiments import them the same way.
mypy_path = "../ml"

# MediaPipe and scikit-learn ship no type information, so their surfaces are
# untyped by necessity. Everything we build on top of them stays strictly typed.
[[tool.mypy.overrides]]
module = ["mediapipe.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run, as the real application has. With a loop
# per test, the module-level engine's pooled connections outlive the loop that
# opened them and the next test dies on "Event loop is closed".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
