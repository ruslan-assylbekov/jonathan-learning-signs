services:
  api:
    build: ./backend
    env_file: .env
    environment:
      # Inside the network the services answer to their service names, which is
      # not what the host-side .env says.
      DATABASE_URL: postgresql+asyncpg://sign:sign@postgres:5432/sign
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sign
      POSTGRES_PASSWORD: sign
      POSTGRES_DB: sign
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
