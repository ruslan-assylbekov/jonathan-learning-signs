name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }

    # Integration tests run against a real Postgres (CLAUDE.md 13), so the
    # repository and migration tests are not skipped in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sign
          POSTGRES_PASSWORD: sign
          POSTGRES_DB: sign
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://sign:sign@localhost:5432/sign
      DEV_AUTH: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group ml
      - run: uv run ruff check . ../ml ../experiments
      - run: uv run ruff format --check . ../ml ../experiments
      - run: uv run mypy app tests ../ml ../experiments
      - run: uv run alembic upgrade head
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Type-checks, then bundles. The MediaPipe binaries are not needed to
      # build: they are fetched at runtime from public/ (npm run vendor).
      - run: npm run build
